<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Mô hình Quản lý Học tập FIT@HCMUS</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Chỉ áp dụng cho hai trang xác thực; không ảnh hưởng các trang khác. -->
    <style>
        #auth-form .form-actions.auth-submit-row {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 100%;
            margin: 20px 0 0;
            padding: 0 !important;
            gap: 0;
        }
        #auth-form .auth-submit-row .btn-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto !important;
            text-align: center;
            min-width: 144px;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-brand">
            <div class="logo-hcmus">
                <span class="logo-hcm">HCM</span>
                <span class="logo-us">US</span>
            </div>
            <div class="logo-text">
                <div class="brand-title">fit@hcmus</div>
                <div class="brand-subtitle">Khoa Công nghệ thông tin</div>
            </div>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-item">Đăng nhập</a>
            <span class="nav-divider">|</span>
            <a href="register.html" class="nav-item active">Đăng ký</a>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Content Banner Header -->
        <div class="header-titles">
            <h3 class="sub-heading">Trường Đại học Khoa học Tự nhiên, ĐHQG - TPHCM</h3>
            <h1 class="main-heading">MÔ HÌNH QUẢN LÍ HỌC TẬP</h1>
            <p class="major-info">Ngành: Khoa học máy tính</p>
        </div>

        <!-- Register Form Card -->
        <div class="login-card">
            <h2 class="card-title">Đăng ký</h2>
            
            <form class="login-form" id="auth-form">
                <div class="form-group">
                    <label for="fullname" class="form-label">Họ và tên:</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="fullname" name="fullname" class="form-control" autocomplete="name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="student-id" class="form-label">Mã số sinh viên:</label>
                    <div class="input-wrapper input-wrapper-medium">
                        <span class="input-icon text-icon">ID</span>
                        <input type="text" id="student-id" name="student-id" class="form-control" autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mật khẩu:</label>
                    <div class="input-wrapper input-wrapper-medium">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" class="form-control" autocomplete="new-password">
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password" class="form-label">Xác nhận mật khẩu:</label>
                    <div class="input-wrapper input-wrapper-medium">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="confirm-password" name="confirm-password" class="form-control" autocomplete="new-password">
                    </div>
                </div>

                <div class="form-actions auth-submit-row">
                    <button type="submit" class="btn-submit" id="auth-submit">Đăng ký</button>
                </div>

                <div class="divider"></div>

                <div class="register-prompt">
                    Đã có tài khoản? <a href="index.html" class="register-link">Đăng nhập ngay.</a>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js?v=20261115-auth-enter-center-v2"></script>
    <script>
    (function () {
        const form = document.getElementById('auth-form');
        if (!form) return;

        // Cả Enter và nút xác nhận đều đi qua một hàm.
        function performAuth() {
            if (typeof window.registerUser !== 'function') {
                console.error('Không tìm thấy registerUser() trong script.js.');
                alert('Không tải được chức năng xác thực. Hãy kiểm tra script.js rồi tải lại trang.');
                return;
            }
            try {
                window.registerUser();
            } catch (error) {
                console.error('Lỗi xác thực:', error);
                alert('Có lỗi khi xử lý thông tin. Hãy mở F12 → Console để xem chi tiết.');
            }
        }

        // Nhấn nút xác nhận hoặc submit biểu mẫu bằng bàn phím.
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            performAuth();
        });

        // Enter tại bất kỳ ô nhập nào cũng xử lý ngay, kể cả khi submit ngầm bị chặn.
        form.addEventListener('keydown', function (event) {
            if (event.key !== 'Enter' || event.isComposing || event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
            if (!event.target.matches('input')) return;
            event.preventDefault();
            event.stopPropagation();
            performAuth();
        }, true);
    })();
    </script>

</body>
</html>
